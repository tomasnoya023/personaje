<h2>Avatar</h2><div class="chips">${EM.map(e=>`<span class="chip ${e===sEmoji?'on':''}" onclick="sEmoji='${e}';keepNick();render()">${e}</span>`).join('')}</div>
<h2>Color del avatar</h2><div class="chips">${COL.map(c=>`<span class="dot ${c===sColor?'on':''}" style="background:${c}" onclick="sColor='${c}';keepNick();render()"></span>`).join('')}</div>
<h2>Color de la app</h2><div class="chips">${ACC.map((c,i)=>`<span class="dot ${i===sAcc?'on':''}" style="background:${c}" onclick="sAcc=${i};keepNick();applyAcc(${i});render()"></span>`).join('')}</div>
<button onclick="saveProfile()">Guardar</button></div>`}
function keepNick(){const n=$('#nick');if(n)me={...(me||{}),nick:n.value}}
function saveProfile(){run(async()=>{const n=$('#nick').value.trim();if(!n)throw new Error('Poné un apodo');
  me={played:0,won:0,streak:0,best:0,qsTotal:0,wins:0,fast:99,hist:[],cc:[],...(me||{}),nick:n,emoji:sEmoji,color:sColor,acc:sAcc};applyAcc();play('edit');await pRef().set(me);view='menu';render()})}
function vMenu(){return `<h1>🎭 ¿Qué personaje soy?</h1><div style="text-align:center">${av(me)}</div><p class="sub">Hola, ${esc(me.nick)}</p>
<button class="big" onclick="go('play')">🎮 Jugar</button><button class="big sec" onclick="go('profile')">👤 Perfil</button><button class="big sec" onclick="go('shop')">🛍️ Tienda · 🪙 ${me.coins||0}</button>`}
function vProfile(){
  const avg=me.wins?(me.qsTotal/me.wins).toFixed(1):'–';
  const logros=[[me.won>=1,'🏆 Primera victoria'],[me.fast<=3,'⚡ Adiviné en 3 preguntas o menos'],[me.best>=3,'🔥 Racha de 3 victorias'],[me.played>=10,'🎉 10 partidas jugadas']];
  return `<button class="back" onclick="go('menu')">← Volver</button><h1>${esc(me.emoji)} ${esc(me.nick)}</h1>
<div class="grid"><div class="card stat"><b>${me.played}</b><span>Partidas</span></div><div class="card stat"><b>${me.won}</b><span>Ganadas</span></div>
<div class="card stat"><b>${avg}</b><span>Preguntas promedio</span></div><div class="card stat"><b>${me.best}</b><span>Mejor racha</span></div></div>
<h2>Logros</h2><div class="card">${logros.map(l=>`<div style="opacity:${l[0]?1:.4}">${l[1]}</div>`).join('')}</div>
<h2>Últimas partidas</h2><div class="card">${me.hist.length?me.hist.map(h=>`<div class="pl"><span class="n">${esc(h.c)}</span><span class="tag">${h.r==='win'?'🏆 '+h.q+' pts':h.q+' pts'}</span></div>`).join(''):'<span class="mut">Todavía no jugaste.</span>'}</div>
<h2>Ajustes</h2><div class="card"><div class="row"><button class="sec sm" onclick="sEmoji=me.emoji;sColor=me.color||COL[0];sAcc=me.acc||0;go('setup')">Editar perfil</button><button class="sec sm" onclick="toggleTheme()">🌗 Tema</button><button class="sec sm" onclick="toggleSnd()">${snd?'🔊':'🔇'} Sonido</button></div></div>`}
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark'}
/* ---------- jugar / crear / unirse ---------- */
function vPlay(){return `<button class="back" onclick="go('menu')">← Volver</button><h1>Jugar</h1><p class="sub">De 2 a 6 jugadores</p>
<button class="big" onclick="go('create')">➕ Crear partida</button><button class="big sec" onclick="go('join')">🔑 Unirse</button>`}
const pd=()=>({name:me.nick,emoji:me.emoji,color:me.color||COL[0],bn:(me.eq||{}).bn||'',fx:(me.eq||{}).fx||'confetti',lives:2,total:0,qs:0,done:'',score:0,doneAt:0});
const av=p=>`<span class="av" style="background:${esc(p.color||COL[0])}">${esc(p.emoji)}</span>`;
function sel(){if(mode==='default')return{cats:Object.keys(CATS),cc:{}};
  const o={};(me.cc||[]).forEach(c=>{if(ccSel.includes(c.n))o[c.n]=c.ch});if(custom.length)o['✍️ Extras']=custom;return{cats,cc:o}}
function count(){const s=sel();return new Set([...s.cats.filter(c=>CATS[c]).flatMap(c=>CATS[c]),...Object.values(s.cc).flat()].map(norm)).size}
function vCreate(){const cc=me.cc||[];return `<button class="back" onclick="go('play')">← Volver</button><h1>Crear partida</h1>
<div class="row"><button class="${mode==='default'?'':'sec'}" onclick="mode='default';render()">Por defecto</button><button class="${mode==='custom'?'':'sec'}" onclick="mode='custom';render()">Personalizar</button></div>
${mode==='default'?'<div class="card">Todas las categorías mezcladas y personajes al azar ✨</div>':`
<h2>Categorías</h2><div class="row"><button class="sec sm" onclick="cats=Object.keys(CATS);render()">Todas</button><button class="sec sm" onclick="cats=[];render()">Ninguna</button></div>
<div class="chips">${Object.keys(CATS).map((c,i)=>`<span class="chip ${cats.includes(c)?'on':''}" onclick="togCat(${i})">${esc(c)}</span>`).join('')}</div>
<h2>Mis categorías</h2>
${cc.map((c,i)=>`<div class="pl"><span class="chip ${ccSel.includes(c.n)?'on':''}" onclick="togCC(${i})">${esc(c.n)} · ${c.ch.length}</span><span class="n"></span><button class="sec sm" onclick="delCat(${i})">🗑</button></div>`).join('')||'<p class="mut">Todavía no creaste ninguna.</p>'}
<div class="card"><b>Nueva categoría</b><input id="nn" placeholder="Nombre (ej: Mis amigos)" value="${esc(nName)}" oninput="nName=this.value" style="margin:8px 0"><textarea id="nc" placeholder="Personajes separados por coma o enter" oninput="nChars=this.value">${esc(nChars)}</textarea><button class="sec" onclick="saveCat()">Guardar categoría</button></div>
<h2>Personajes sueltos</h2><div class="row"><input id="add" placeholder="Ej: mi profe de mate" onkeydown="if(event.key==='Enter')addC()"><button class="sm" onclick="addC()">+</button></div>
<div class="chips">${custom.map((c,i)=>`<span class="chip on" onclick="custom.splice(${i},1);render()">${esc(c)} ✕</span>`).join('')}</div>
<div class="chips"><span class="chip ${hint?'on':''}" onclick="hint=!hint;render()">💡 Pista: ver la categoría de mi personaje</span></div>
<h2>Rondas</h2><div class="row"><button class="sm sec" onclick="rounds=Math.max(3,rounds-1);render()">−</button><b style="font-size:26px;flex:1;text-align:center">${rounds}</b><button class="sm sec" onclick="rounds=Math.min(9,rounds+1);render()">+</button></div>`}
<p class="mut" style="text-align:center">${count()} personajes disponibles</p><button onclick="createRoom()">Crear sala</button>`}
function togCat(i){const c=Object.keys(CATS)[i];cats=cats.includes(c)?cats.filter(x=>x!==c):[...cats,c];render()}
function togCC(i){const n=me.cc[i].n;ccSel=ccSel.includes(n)?ccSel.filter(x=>x!==n):[...ccSel,n];render()}
function addC(){const v=$('#add').value.trim();if(v){custom.push(v.slice(0,30));render();$('#add').focus()}}
function saveCat(){run(async()=>{const n=nName.trim(),ch=[...new Set(nChars.split(/[,\n]/).map(x=>x.trim().slice(0,30)).filter(Boolean))].slice(0,300);
  if(!n||ch.length<2)throw new Error('Poné un nombre y al menos 2 personajes');
  me.cc=[...(me.cc||[]).filter(c=>c.n!==n),{n,ch}];if(!ccSel.includes(n))ccSel.push(n);nName='';nChars='';await pRef().set(me);render()})}
function delCat(i){run(async()=>{const n=me.cc[i].n;me.cc.splice(i,1);ccSel=ccSel.filter(x=>x!==n);await pRef().set(me);render()})}
function createRoom(){run(async()=>{const s=sel();if(count()<2)throw new Error('Hacen falta al menos 2 personajes');
  const A='ABCDEFGHJKMNPQRSTUVWXYZ';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
  await rRef(c).set({code:c,host:uid,status:'lobby',cats:s.cats,cc:s.cc,hint:mode==='custom'&&hint,rounds:mode==='custom'?rounds:3,game:0,order:[],chars:{},cat:{},turn:'',round:0});
  await plRef(c,uid).set(pd());enter(c)})}
function vJoin(){return `<button class="back" onclick="go('play')">← Volver</button><h1>Unirse</h1><p class="sub">Pedile el código al host</p>
<div class="card"><input id="jc" maxlength="5" placeholder="CÓDIGO" style="text-align:center;font-size:28px;letter-spacing:6px;text-transform:uppercase" value="${esc(joinCode)}" oninput="joinCode=this.value.toUpperCase()"><button onclick="joinRoom()">Entrar</button></div>`}
function joinRoom(){run(async()=>{
  const c=joinCode.trim().toUpperCase();if(c.length!==5)throw new Error('El código tiene 5 letras');
  const s=await rRef(c).get();if(!s.exists)throw new Error('No existe esa sala');
  const ps=await db.collection('rooms/'+c+'/players').get();
  const already=ps.docs.some(d=>d.id===uid);
  if(!already){if(s.data().status!=='lobby')throw new Error('La partida ya empezó');if(ps.size>=6)throw new Error('La sala está llena (máx. 6)');
    await plRef(c,uid).set(pd())}
  enter(c)})}
/* ---------- sala ---------- */
function enter(c){
  leaveSubs();startChat(c);code=c;room=null;players=[];rec='';view='room';render();
  unsubs.push(rRef(c).onSnapshot(s=>{room=s.exists?s.data():null;onChange()},e=>{msg='Error de conexión';render()}));
  unsubs.push(db.collection('rooms/'+c+'/players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));onChange()}));
}
function leaveSubs(){unsubs.forEach(u=>u());unsubs=[];if(chCh){sb.removeChannel(chCh);chCh=null}chatOpen=false}
function onChange(){
  if(view!=='room'||!room){if(view==='room'){render()}return}
  if(players.length>lastN&&room.status==='lobby')play('join');lastN=players.length;
  if(room.status==='playing'&&room.turn===uid&&lastT!==uid)play('turn');lastT=room.turn;
  if(room.status==='playing'&&room.host===uid&&players.length&&players.every(p=>p.done)){const k=code+room.game+':'+room.round;if(adv!==k){adv=k;endRound()}}
  if(room.status==='finished'&&rec!==code+room.game){rec=code+room.game;record();finishFx()}
  render();
}
function record(){run(async()=>{const m=P(uid);if(m.total==null)return;
  const top=Math.max(...players.map(p=>p.total||0)),won=top>0&&m.total===top;
  me.played++;if(won){me.won++;me.streak++;me.best=Math.max(me.best,me.streak);coin(500)}else me.streak=0;
  me.hist=[{c:room.rounds+' rondas',r:won?'win':'end',q:m.total},...me.hist].slice(0,10);await pRef().set(me)})}
function leaveRoom(){
  const c=code,wasLobby=room&&room.status==='lobby'&&room.host!==uid;leaveSubs();
  if(wasLobby)plRef(c,uid).delete().catch(()=>{});code=null;room=null;go('menu')}
function vRoom(){return roomBody()+(room?chatUI():'')}
function roomBody(){
  if(!room)return `<p class="sub">Conectando a la sala…</p><button class="sec" onclick="leaveRoom()">Salir</button>`;
  const isHost=room.host===uid;
  if(room.status==='lobby'){const nc=room.cats.filter(c=>CATS[c]).length+Object.keys(room.cc||{}).length;
    return `<h1>Sala</h1><div class="code">${esc(code)}</div><p class="sub">Pasales este código a tus besties</p>
<div class="card">${players.map(p=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n">${esc(p.name)}</span>${p.id===room.host?'<span class="tag">host</span>':''}</div>`).join('')}
<p class="mut">${players.length}/6 jugadores · ${nc} categorías · ${room.rounds||3} rondas${room.hint?' · con pista 💡':''}</p></div>
${isHost?`<button ${players.length<2?'disabled':''} onclick="startGame(true)">${players.length<2?'Esperando jugadores (mín. 2)':'¡Empezar!'}</button>`:'<p class="sub">Esperando que el host empiece…</p>'}
<button class="sec" onclick="leaveRoom()">Salir</button>`}
  if(room.status==='roundend'){const rk=[...players].sort((a,b)=>(b.total||0)-(a.total||0));
    return `<h1>Ronda ${room.round}/${room.rounds} ✔</h1><div class="card">${rk.map(p=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n"><b>${esc(p.name)}</b> ${hearts(p)}<div class="mut">${esc(room.chars[p.id])} · ${p.done==='win'?'+'+p.score+' pts':p.done==='out'?'sin corazones':'se rindió'}</div></span><b>${p.total||0}</b></div>`).join('')}</div>
${isHost?'<button onclick="startGame(false)">➡️ Siguiente ronda</button>':'<p class="sub">Esperando que el host siga…</p>'}<button class="sec" onclick="leaveRoom()">Salir</button>`}
  if(room.status==='finished'){
    const rk=[...players].sort((a,b)=>(b.total||0)-(a.total||0));
    return `<h1>🏁 Final</h1><div class="card">${rk.map((p,i)=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n"><b>${i===0&&p.fx==='crown'&&p.total?'👑':['🥇','🥈','🥉'][i]||'🎖️'} ${esc(p.name)}</b><div class="mut">${room.rounds} rondas</div></span><b>${p.total||0} pts</b></div>`).join('')}</div>
${isHost?'<button onclick="rematch()">🔁 Revancha</button>':'<p class="sub">El host puede iniciar la revancha</p>'}<button class="sec" onclick="leaveRoom()">Salir</button>`}
  const m=P(uid),mine=room.turn===uid&&!m.done,tp=P(room.turn);
  return `<div class="mut" style="text-align:center">Sala ${esc(code)}</div>
<div class="turn">${m.done?(m.done==='win'?'🎉 ¡Adivinaste! Sos espectador':(m.done==='out'?'🖤 Te quedaste sin corazones. Sos espectador':'Te rendiste. Sos espectador')):mine?'👉 ¡Es tu turno! Hacé tu pregunta en voz alta':'Turno de '+esc(tp.emoji||'')+' '+esc(tp.name||'…')}</div>
<div class="card" style="text-align:center"><div class="mut">Tu personaje</div>${m.done?`<div class="ch">${esc(room.chars[uid])}</div>`:'<div class="q">❓</div>'}${room.hint&&!m.done?`<span class="tag">💡 ${esc((room.cat||{})[uid]||'')}</span>`:''}<div class="hearts">${hearts(m)}</div><div class="mut">Ronda ${room.round}/${room.rounds} · Preguntas usadas: ${m.qs||0}</div></div>
<h2>Los demás</h2>${players.filter(p=>p.id!==uid).map(p=>`<div class="card pl ${bnc(p)}">${av(p)}<span class="n">${esc(p.name)} ${hearts(p)}<div class="ch">${esc(room.chars[p.id])}</div></span>${p.done?`<span class="tag">${p.done==='win'?'✔ adivinó':p.done==='out'?'🖤 eliminado':'se rindió'}</span>`:''}</div>`).join('')}
${mine?(guessing?`<div class="card"><input id="gin" placeholder="Creo que soy…" oninput="gtext=this.value" onkeydown="if(event.key==='Enter')guess()"><button onclick="guess()">Confirmar</button><button class="sec" onclick="guessing=false;render()">Cancelar</button></div>`
:`<button onclick="passTurn()">✅ Ya me respondieron (pasar turno)</button><button class="sec" onclick="guessing=true;gtext='';render()">🤔 Creo que soy…</button>`):''}
${!m.done?'<button class="back" onclick="giveUp()">Me rindo</button>':''}${isHost&&room.turn&&!P(room.turn).done?'<button class="back" onclick="skipTurn()">Saltear turno de '+esc(tp.name||'')+' (host)</button>':''}
<button class="back" onclick="leaveRoom()">Salir de la sala</button><div style="height:70px"></div>`;
}
function startGame(first){run(async()=>{
  const seen=new Set(),all=[...room.cats.filter(c=>CATS[c]).flatMap(c=>CATS[c].map(n=>[n,c])),...Object.entries(room.cc||{}).flatMap(([c,a])=>a.map(n=>[n,c]))].filter(([n])=>{const k=norm(n);if(seen.has(k))return false;seen.add(k);return true});
  if(all.length<players.length)throw new Error('Hay menos personajes que jugadores: sumá más categorías');
  let used=first?[]:(room.used||[]),pool=all.filter(([n])=>!used.includes(n));if(pool.length<players.length){pool=all;used=[]}
  const pick=shuffle(pool),order=shuffle(players.map(p=>p.id)),chars={},cat={};
  order.forEach((u,i)=>{chars[u]=pick[i][0];cat[u]=pick[i][1]});
  await Promise.all(players.map(p=>plRef(code,p.id).update(first?{qs:0,done:'',score:0,doneAt:0,lives:2,total:0}:{qs:0,done:'',score:0,doneAt:0,lives:2})));
  await rRef(code).update({status:'playing',order,chars,cat,used:[...used,...order.map(u=>chars[u])],turn:order[0],round:first?1:room.round+1,game:first?(room.game||0)+1:room.game,rounds:room.rounds||3})})}
const cats2=a=>a.filter(c=>CATS[c]);
function rematch(){run(async()=>{await rRef(code).update({status:'lobby',chars:{},order:[],turn:''})})}
function nextAfter(from,doneIds){
  const o=room.order,i=o.indexOf(from);
  for(let k=1;k<=o.length;k++){const u=o[(i+k)%o.length];if(!doneIds.includes(u)&&!P(u).done)return u}
  return ''}
function passTurn(){run(async()=>{const n=nextAfter(uid,[]);
  await plRef(code,uid).update({qs:(P(uid).qs||0)+1});await rRef(code).update({turn:n})})}
function guess(){run(async()=>{
  const g=norm(gtext);if(!g)return;const c=norm(room.chars[uid]),qs=(P(uid).qs||0)+1;
  const ok=g===c||(Math.min(g.length,c.length)>=4&&(c.includes(g)||g.includes(c)));
  guessing=false;gtext='';
  if(ok){me.wins++;me.qsTotal+=qs;me.fast=Math.min(me.fast,qs);confetti();coin(100);await plRef(code,uid).update({qs,done:'win',score:Math.max(1,11-qs),doneAt:Date.now()});await rRef(code).update({turn:nextAfter(uid,[uid])});}
  else{const l=(P(uid).lives??2)-1;
    if(l<=0){play('lose');await plRef(code,uid).update({qs,lives:0,done:'out',score:0,doneAt:Date.now()});await rRef(code).update({turn:nextAfter(uid,[uid])});msg='Sin corazones 🖤 Quedaste fuera de la ronda'}
    else{await plRef(code,uid).update({qs,lives:l});await rRef(code).update({turn:nextAfter(uid,[])});play('wrong');msg='Nop, ese no es 💔 Te queda medio corazón'}
    render()}})}
function giveUp(){if(!confirm('¿Seguro que te rendís?'))return;run(async()=>{
  play('lose');const wasTurn=room.turn===uid;await plRef(code,uid).update({done:'gaveup',lives:0,score:0,doneAt:Date.now()});
  if(wasTurn)await rRef(code).update({turn:nextAfter(uid,[uid])})})}
function skipTurn(){run(async()=>{await rRef(code).update({turn:nextAfter(room.turn,[])})})}
document.addEventListener('click',e=>{if(e.target.closest('button,.chip,.dot'))play('click')});
init();
</script>
</body>
</html>
