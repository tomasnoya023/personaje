function mkDb(){

    return{t:'players',k:{room_code:s[1],user_id:s[3]}}};
  const snap=(id,d)=>({id,exists:!!d,data:()=>d});
  const sub=(t,filter,f)=>{let on=true;const run=()=>on&&f();run();
    const ch=sb.channel('c'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:t,filter},run).subscribe();
    return()=>{on=false;sb.removeChannel(ch)}};

    doc(p){const{t,k}=parse(p),id=p.split('/').pop();
      const get=async()=>{const{data,error}=await sb.from(t).select('data').match(k).maybeSingle();if(error)throw error;return snap(id,data&&data.data)};
      const set=async d=>{const{error}=await sb.from(t).upsert({...k,data:d});if(error)throw error};
      return{get,set,
        update:async d=>{const cur=(await get()).data()||{};await set({...cur,...d})},
        delete:async()=>{const{error}=await sb.from(t).delete().match(k);if(error)throw error},
        onSnapshot(next,err){const[a,b]=Object.entries(k)[0];return sub(t,a+'=eq.'+b,()=>get().then(next).catch(err))}}},
    collection(p){const c=p.split('/')[1];
      const get=async()=>{const{data,error}=await sb.from('players').select('user_id,data').eq('room_code',c);if(error)throw error;
        const docs=data.map(r=>snap(r.user_id,r.data));return{docs,size:docs.length}};

  const top=Math.max(...players.map(p=>p.total||0)),won=top>0&&m.total===top;
  me.played++;if(won){me.won++;me.streak++;me.best=Math.max(me.best,me.streak);coin(500)}else me.streak=0;
  me.hist=[{c:room.rounds+' rondas',r:won?'win':'end',q:m.total},...me.hist].slice(0,10);await pRef().set(me)})}
function leaveRoom(){
  const c=code,wasLobby=room&&room.status==='lobby'&&room.host!==uid;leaveSubs();
  if(wasLobby)plRef(c,uid).delete().catch(()=>{});code=null;room=null;go('menu')}
function vRoom(){return roomBody()+(room?chatUI():'')}
function roomBody(){
  if(!room)return `<p class="sub">Conectando a la sala…</p><button class="sec" onclick="leaveRoom()">Salir</button>`;
  const isHost=room.host===uid;
  if(room.status==='lobby'){const nc=room.cats.filter(c=>CATS[c]).length+Object.keys(room.cc||{}).length;
    return `<h1>Sala</h1><div class="code">${esc(code)}</div><p class="sub">Pasales este código a tus besties</p>
<div class="card">${players.map(p=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n">${esc(p.name)}</span>${p.id===room.host?'<span class="tag">host</span>':''}</div>`).join('')}
<p class="mut">${players.length}/6 jugadores · ${nc} categorías · ${room.rounds||3} rondas${room.hint?' · con pista':''}</p></div>
${isHost?`<button ${players.length<2?'disabled':''} onclick="startGame(true)">${players.length<2?'Esperando jugadores (mín. 2)':'¡Empezar!'}</button>`:'<p class="sub">Esperando que el host empiece…</p>'}
<button class="sec" onclick="leaveRoom()">Salir</button>`}
  if(room.status==='roundend'){const rk=[...players].sort((a,b)=>(b.total||0)-(a.total||0));
    return `<h1>Ronda ${room.round}/${room.rounds}</h1><div class="card">${rk.map(p=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n"><b>${esc(p.name)}</b> ${hearts(p)}<div class="mut">${esc(room.chars[p.id])} · ${p.done==='win'?'+'+p.score+' pts':p.done==='out'?'sin corazones':'se rindió'}</div></span><b>${p.total||0}</b></div>`).join('')}</div>
${isHost?'<button onclick="startGame(false)">'+ic('card_flip')+'Siguiente ronda</button>':'<p class="sub">Esperando que el host siga…</p>'}<button class="sec" onclick="leaveRoom()">Salir</button>`}
  if(room.status==='finished'){
    const rk=[...players].sort((a,b)=>(b.total||0)-(a.total||0));
    return `<h1>${ic('crown_a')}Final</h1><div class="card">${rk.map((p,i)=>`<div class="pl ${bnc(p)}">${av(p)}<span class="n"><b>${rkTag(i,p)} ${esc(p.name)}</b><div class="mut">${room.rounds} rondas</div></span><b>${p.total||0} pts</b></div>`).join('')}</div>
${isHost?'<button onclick="rematch()">'+ic('cards_shuffle')+'Revancha</button>':'<p class="sub">El host puede iniciar la revancha</p>'}<button class="sec" onclick="leaveRoom()">Salir</button>`}
  const m=P(uid),mine=room.turn===uid&&!m.done,tp=P(room.turn);
  return `<div class="mut" style="text-align:center">Sala ${esc(code)}</div>
<div class="play"><div class="turn">${m.done?(m.done==='win'?ic('tag_d6_check')+'¡Adivinaste! Sos espectador':(m.done==='out'?ic('skull')+'Te quedaste sin corazones. Sos espectador':ic('flag_triangle')+'Te rendiste. Sos espectador')):mine?ic('pawn_right')+'¡Es tu turno! Hacé tu pregunta en voz alta':ic('hourglass')+'Turno de '+esc(tp.name||'…')}</div>
<div class="card mine" style="text-align:center">${petOf(m,mine)}<div class="mut">Tu personaje</div>${m.done?`<div class="ch">${esc(room.chars[uid])}</div>`:EYES}${!m.done?`<span class="tag">${ic('hexagon_question')}${esc((room.cat||{})[uid]||'')}</span>`:''}<div class="hearts">${hearts(m)}</div><div class="mut">Ronda ${room.round}/${room.rounds} · Preguntas usadas: ${m.qs||0}</div></div>
<div class="oth"><h2>Los demás</h2>${players.filter(p=>p.id!==uid).map(p=>`<div class="card pl ${bnc(p)}">${av(p)}<span class="n">${esc(p.name)} ${hearts(p)}<div class="ch">${esc(room.chars[p.id])}</div><div class="mut">${esc([DESC[room.chars[p.id]],(room.cat||{})[p.id]].filter(Boolean).join(' · '))}</div>${vsw(p)}</span>${p.done?`<span class="tag">${p.done==='win'?ic('tag_d6_check')+'adivinó':p.done==='out'?ic('skull')+'eliminado':ic('flag_triangle')+'se rindió'}</span>`:''}</div>`).join('')}</div>
<div class="act">${mine?(guessing?`<div class="card"><input id="gin" placeholder="Creo que soy…" oninput="gtext=this.value" onkeydown="if(event.key==='Enter')guess()"><button onclick="guess()">Confirmar</button><button class="sec" onclick="guessing=false;render()">Cancelar</button></div>`
:`<button onclick="passTurn()">${ic('tag_d6_check')}Ya me respondieron (pasar turno)</button><button class="sec" onclick="guessing=true;gtext='';render()">${ic('dice_question')}Creo que soy…</button>`):''}
${!m.done?'<button class="back" onclick="giveUp()">'+ic('flag_triangle')+'Me rindo</button>':''}${isHost&&room.turn&&!P(room.turn).done?'<button class="back" onclick="skipTurn()">'+ic('pawn_skip')+'Saltear turno de '+esc(tp.name||'')+' (host)</button>':''}
<button class="back" onclick="leaveRoom()">Salir de la sala</button></div></div><div style="height:70px"></div>`;
}
function startGame(first){run(async()=>{
  const seen=new Set(),all=[...room.cats.filter(c=>CATS[c]).flatMap(c=>CATS[c].map(n=>[n,c])),...Object.entries(room.cc||{}).flatMap(([c,a])=>a.map(n=>[n,c]))].filter(([n])=>{const k=norm(n);if(seen.has(k))return false;seen.add(k);return true});
  if(all.length<players.length)throw new Error('Hay menos personajes que jugadores: sumá más categorías');
  let used=first?[]:(room.used||[]),pool=all.filter(([n])=>!used.includes(n));if(pool.length<players.length){pool=all;used=[]}
  const pick=shuffle(pool),order=shuffle(players.map(p=>p.id)),chars={},cat={};
  order.forEach((u,i)=>{chars[u]=pick[i][0];cat[u]=pick[i][1]});
  await Promise.all(players.map(p=>plRef(code,p.id).update(first?{qs:0,done:'',score:0,doneAt:0,lives:2,total:0,swv:''}:{qs:0,done:'',score:0,doneAt:0,lives:2,swv:''})));
  await rRef(code).update({status:'playing',order,chars,cat,used:[...used,...order.map(u=>chars[u])],turn:order[0],round:first?1:room.round+1,game:first?(room.game||0)+1:room.game,rounds:room.rounds||3})})}
const cats2=a=>a.filter(c=>CATS[c]);
function rematch(){run(async()=>{await rRef(code).update({status:'lobby',chars:{},order:[],turn:''})})}
function nextAfter(from,doneIds){
  const o=room.order,i=o.indexOf(from);
  for(let k=1;k<=o.length;k++){const u=o[(i+k)%o.length];if(!doneIds.includes(u)&&!P(u).done)return u}
  return ''}
function passTurn(){run(async()=>{const n=nextAfter(uid,[]);
  await plRef(code,uid).update({qs:(P(uid).qs||0)+1});await rRef(code).update({turn:n})})}
function guess(){run(async()=>{
  const g=norm(gtext);if(!g)return;const c=norm(room.chars[uid]),qs=(P(uid).qs||0)+1;
  const ok=g===c||(Math.min(g.length,c.length)>=4&&(c.includes(g)||g.includes(c)));
  guessing=false;gtext='';
  if(ok){me.wins++;me.qsTotal+=qs;me.fast=Math.min(me.fast,qs);confetti();coin(100);await plRef(code,uid).update({qs,done:'win',score:Math.max(1,11-qs),doneAt:Date.now()});await rRef(code).update({turn:nextAfter(uid,[uid])});}
  else{const l=(P(uid).lives??2)-1;
    if(l<=0){play('lose');await plRef(code,uid).update({qs,lives:0,done:'out',score:0,doneAt:Date.now()});await rRef(code).update({turn:nextAfter(uid,[uid])});msg='Sin corazones. Quedaste fuera de la ronda'}
    else{await plRef(code,uid).update({qs,lives:l});await rRef(code).update({turn:nextAfter(uid,[])});play('wrong');msg='Nop, ese no es. Te queda medio corazón'}
    render()}})}
function giveUp(){if(!confirm('¿Seguro que te rendís?'))return;run(async()=>{
  play('lose');const wasTurn=room.turn===uid;await plRef(code,uid).update({done:'gaveup',lives:0,score:0,doneAt:Date.now()});
  if(wasTurn)await rRef(code).update({turn:nextAfter(uid,[uid])})})}
function skipTurn(){run(async()=>{await rRef(code).update({turn:nextAfter(room.turn,[])})})}
document.addEventListener('click',e=>{if(e.target.closest('button,.chip,.dot'))play('click')});
const wide=()=>matchMedia('(min-width:900px)').matches;matchMedia('(min-width:900px)').addEventListener('change',()=>render());
document.addEventListener('pointermove',e=>document.querySelectorAll('.eye.trk').forEach(el=>{const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,m=Math.min(d,r.width)*.2;el.querySelector('.pu').style.transform=`translate(${dx/d*m}px,${dy/d*m}px)`}));
document.addEventListener('pointermove',e=>document.querySelectorAll('.axo').forEach(el=>{const r=el.getBoundingClientRect(),h=(Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI+360)%360;lastAx=Math.round(((360-h)%360)/22.5)%16;el.style.setProperty('--r',lastAx)}));
init();
</script>
