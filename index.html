<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué personaje soy?</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7ff;--card:#fff;--tx:#201b2e;--mut:#6f6785;--pri:#7c3aed;--prt:#fff;--bd:#e4dcf5;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14101f;--card:#201a33;--tx:#f1ecfc;--mut:#a79ec2;--pri:#a78bfa;--prt:#14101f;--bd:#352c52}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14101f;--card:#201a33;--tx:#f1ecfc;--mut:#a79ec2;--pri:#a78bfa;--prt:#14101f;--bd:#352c52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
h2{font-size:20px;margin:18px 0 8px}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 16px;background:var(--pri);color:var(--prt);width:100%;margin:6px 0;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}
button.big{padding:26px 16px;font-size:20px}
button.sm{width:auto;padding:8px 12px;margin:0;font-size:14px}
button:disabled{opacity:.45}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--bd);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--card);font-size:15px}
.chip.on{border-color:var(--pri);background:var(--pri);color:var(--prt)}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pl:last-child{border:0}.pl .e{font-size:28px}.pl .n{flex:1}
.ch{font-size:22px;font-weight:800;margin-top:4px}
.turn{background:var(--pri);color:var(--prt);text-align:center;border-radius:14px;padding:12px;font-weight:700;margin:10px 0}
.q{font-size:54px;text-align:center}
.mut{color:var(--mut);font-size:14px}.err{color:var(--bad);text-align:center;font-weight:600;min-height:20px}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--bd)}
.back{background:none;color:var(--mut);width:auto;padding:4px 0;font-weight:500}
</style>
</head>
<body>
<div id="app"><p class="sub">Cargando…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CATS={
"🌟 Famosos":["Messi","Shakira","Taylor Swift","Bad Bunny","Ricardo Darín","Lali","Cristiano Ronaldo","Beyoncé","Tom Holland","Dua Lipa","Maradona","Michael Jackson"],
"📺 Series y pelis":["Walter White","Eleven","Harry Potter","Shrek","Joker","Barbie","Jack Sparrow","Darth Vader","Spider-Man","Gollum","Wednesday Addams","Elsa"],
"🐾 Animales":["Pingüino","Jirafa","Pulpo","Perezoso","Carpincho","Flamenco","Camaleón","Koala","Delfín","Murciélago","Lobo","Ornitorrinco"],
"✏️ Dibujos":["Bob Esponja","Homero Simpson","Pikachu","Goku","Mickey Mouse","Patricio","Mafalda","Bugs Bunny","Garfield","Dora","Peppa Pig","Stitch"],
"🇦🇷 Argentina":["El Chavo","Susana Giménez","Duki","Evita","Milei","Gardel","Coscu","Charly García","El Diego","La Mona Giménez","Fito Páez","Tini"],
"🎭 Memes":["Doge","Pepe la rana","Shrek meme","Gato del arroz","Chimuelo","Nyan Cat","Shiba Inu","Rickroll","Distracted Boyfriend","Grumpy Cat","Moo Deng","Sad Hamster"]};
const EM=["😎","🦊","🐸","👾","🦄","🐙","🔥","🌈","🍕","👻","🐼","🍩"];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user,uid,me,view='setup',code=null,room=null,players=[],unsubs=[],msg='',rec='',gtext='',guessing=false,sEmoji=EM[0];
let mode='default',cats=Object.keys(CATS),custom=[],joinCode='';
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const pRef=()=>db.doc('data/users/'+uid+'/profile'),rRef=c=>db.doc('rooms/'+c),plRef=(c,u)=>db.doc('rooms/'+c+'/players/'+u);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const P=id=>players.find(p=>p.id===id)||{};
async function run(f){try{msg='';await f()}catch(e){msg=(e&&e.message)||'Algo salió mal';render()}}
const SB_URL='https://wwznpprpmvngtsbxlyfi.supabase.co',SB_KEY='sb_publishable_u3eLhJ3RKKd4I-NsZkZh_w___QzAM0K';
const sb=supabase.createClient(SB_URL,SB_KEY);
function mkDb(){
  const parse=p=>{const s=p.split('/');
    if(s[0]==='data')return{t:'profiles',k:{id:s[2]}};
    if(s.length===2)return{t:'rooms',k:{code:s[1]}};
    return{t:'players',k:{room_code:s[1],user_id:s[3]}}};
  const snap=(id,d)=>({id,exists:!!d,data:()=>d});
  const sub=(t,filter,f)=>{let on=true;const run=()=>on&&f();run();
    const ch=sb.channel('c'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:t,filter},run).subscribe();
    return()=>{on=false;sb.removeChannel(ch)}};
  return{
    doc(p){const{t,k}=parse(p),id=p.split('/').pop();
      const get=async()=>{const{data,error}=await sb.from(t).select('data').match(k).maybeSingle();if(error)throw error;return snap(id,data&&data.data)};
      const set=async d=>{const{error}=await sb.from(t).upsert({...k,data:d});if(error)throw error};
      return{get,set,
        update:async d=>{const cur=(await get()).data()||{};await set({...cur,...d})},
        delete:async()=>{const{error}=await sb.from(t).delete().match(k);if(error)throw error},
        onSnapshot(next,err){const[a,b]=Object.entries(k)[0];return sub(t,a+'=eq.'+b,()=>get().then(next).catch(err))}}},
    collection(p){const c=p.split('/')[1];
      const get=async()=>{const{data,error}=await sb.from('players').select('user_id,data').eq('room_code',c);if(error)throw error;
        const docs=data.map(r=>snap(r.user_id,r.data));return{docs,size:docs.length}};
      return{get,onSnapshot(next,err){return sub('players','room_code=eq.'+c,()=>get().then(next).catch(err))}}}}}
async function init(){
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();session=r.data&&r.data.session}
  if(!session){app.innerHTML='<h1>🎭</h1><div class="card">No pude conectar con Supabase. Revisá la URL, la key y que estén activados los inicios de sesión anónimos.</div>';return}
  db=mkDb();uid=session.user.id;
  const s=await pRef().get();
  if(s.exists){me=s.data();view='menu'}
  render();
}
function render(){
  const v={setup:vSetup,menu:vMenu,profile:vProfile,play:vPlay,create:vCreate,join:vJoin,room:vRoom}[view];
  app.innerHTML=v()+(msg?'<p class="err">'+esc(msg)+'</p>':'');
  const g=$('#gin');if(g){g.value=gtext;g.focus()}
}
function go(v){view=v;msg='';render()}
/* ---------- setup & perfil ---------- */
function vSetup(){return `<h1>🎭</h1><h1>¿Qué personaje soy?</h1><p class="sub">Armá tu perfil para empezar</p>
<div class="card"><input id="nick" maxlength="14" placeholder="Tu apodo" value="${esc(me?.nick||'')}">
<div class="chips">${EM.map(e=>`<span class="chip ${e===sEmoji?'on':''}" onclick="sEmoji='${e}';keepNick();render()">${e}</span>`).join('')}</div>
<button onclick="saveProfile()">Guardar</button></div>`}
function keepNick(){const n=$('#nick');if(n)me={...(me||{}),nick:n.value}}
function saveProfile(){run(async()=>{const n=$('#nick').value.trim();if(!n)throw new Error('Poné un apodo');
  me={played:0,won:0,streak:0,best:0,qsTotal:0,wins:0,fast:99,hist:[],...(me||{}),nick:n,emoji:sEmoji};await pRef().set(me);view='menu';render()})}
function vMenu(){return `<h1>🎭 ¿Qué personaje soy?</h1><p class="sub">Hola, ${esc(me.emoji)} ${esc(me.nick)}</p>
<button class="big" onclick="go('play')">🎮 Jugar</button><button class="big sec" onclick="go('profile')">👤 Perfil</button>`}
function vProfile(){
  const avg=me.wins?(me.qsTotal/me.wins).toFixed(1):'–';
  const logros=[[me.won>=1,'🏆 Primera victoria'],[me.fast<=3,'⚡ Adiviné en 3 preguntas o menos'],[me.best>=3,'🔥 Racha de 3 victorias'],[me.played>=10,'🎉 10 partidas jugadas']];
  return `<button class="back" onclick="go('menu')">← Volver</button><h1>${esc(me.emoji)} ${esc(me.nick)}</h1>
<div class="grid"><div class="card stat"><b>${me.played}</b><span>Partidas</span></div><div class="card stat"><b>${me.won}</b><span>Ganadas</span></div>
<div class="card stat"><b>${avg}</b><span>Preguntas promedio</span></div><div class="card stat"><b>${me.best}</b><span>Mejor racha</span></div></div>
<h2>Logros</h2><div class="card">${logros.map(l=>`<div style="opacity:${l[0]?1:.4}">${l[1]}</div>`).join('')}</div>
<h2>Últimas partidas</h2><div class="card">${me.hist.length?me.hist.map(h=>`<div class="pl"><span class="n">${esc(h.c)}</span><span class="tag">${h.r==='win'?'Adiviné en '+h.q:h.r==='gaveup'?'Me rendí':'Sin adivinar'}</span></div>`).join(''):'<span class="mut">Todavía no jugaste.</span>'}</div>
<h2>Ajustes</h2><div class="card"><div class="row"><button class="sec sm" onclick="sEmoji=me.emoji;go('setup')">Editar perfil</button><button class="sec sm" onclick="toggleTheme()">🌗 Tema</button></div></div>`}
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark'}
/* ---------- jugar / crear / unirse ---------- */
function vPlay(){return `<button class="back" onclick="go('menu')">← Volver</button><h1>Jugar</h1><p class="sub">De 2 a 6 jugadores</p>
<button class="big" onclick="go('create')">➕ Crear partida</button><button class="big sec" onclick="go('join')">🔑 Unirse</button>`}
function vCreate(){return `<button class="back" onclick="go('play')">← Volver</button><h1>Crear partida</h1>
<div class="row"><button class="${mode==='default'?'':'sec'}" onclick="mode='default';cats=Object.keys(CATS);custom=[];render()">Por defecto</button><button class="${mode==='custom'?'':'sec'}" onclick="mode='custom';render()">Personalizar</button></div>
${mode==='default'?'<div class="card">Todas las categorías mezcladas y personajes al azar.</div>':`
<h2>Categorías</h2><div class="chips">${Object.keys(CATS).map((c,i)=>`<span class="chip ${cats.includes(c)?'on':''}" onclick="togCat(${i})">${esc(c)}</span>`).join('')}</div>
<h2>Añadir personajes</h2><div class="row"><input id="add" placeholder="Ej: mi profe de mate" onkeydown="if(event.key==='Enter')addC()"><button class="sm" onclick="addC()">+</button></div>
<div class="chips">${custom.map((c,i)=>`<span class="chip on" onclick="custom.splice(${i},1);render()">${esc(c)} ✕</span>`).join('')}</div>`}
<button onclick="createRoom()">Crear sala</button>`}
function togCat(i){const c=Object.keys(CATS)[i];cats=cats.includes(c)?cats.filter(x=>x!==c):[...cats,c];render()}
function addC(){const v=$('#add').value.trim();if(v){custom.push(v.slice(0,30));render();$('#add').focus()}}
function createRoom(){run(async()=>{
  const A='ABCDEFGHJKMNPQRSTUVWXYZ';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
  await rRef(c).set({code:c,host:uid,status:'lobby',cats,custom,order:[],chars:{},turn:'',round:0});
  await plRef(c,uid).set({name:me.nick,emoji:me.emoji,qs:0,done:'',score:0,doneAt:0});enter(c)})}
function vJoin(){return `<button class="back" onclick="go('play')">← Volver</button><h1>Unirse</h1><p class="sub">Pedile el código al host</p>
<div class="card"><input id="jc" maxlength="5" placeholder="CÓDIGO" style="text-align:center;font-size:28px;letter-spacing:6px;text-transform:uppercase" value="${esc(joinCode)}" oninput="joinCode=this.value.toUpperCase()"><button onclick="joinRoom()">Entrar</button></div>`}
function joinRoom(){run(async()=>{
  const c=joinCode.trim().toUpperCase();if(c.length!==5)throw new Error('El código tiene 5 letras');
  const s=await rRef(c).get();if(!s.exists)throw new Error('No existe esa sala');
  const ps=await db.collection('rooms/'+c+'/players').get();
  const already=ps.docs.some(d=>d.id===uid);
  if(!already){if(s.data().status!=='lobby')throw new Error('La partida ya empezó');if(ps.size>=6)throw new Error('La sala está llena (máx. 6)');
    await plRef(c,uid).set({name:me.nick,emoji:me.emoji,qs:0,done:'',score:0,doneAt:0})}
  enter(c)})}
/* ---------- sala ---------- */
function enter(c){
  leaveSubs();code=c;room=null;players=[];rec='';view='room';render();
  unsubs.push(rRef(c).onSnapshot(s=>{room=s.exists?s.data():null;onChange()},e=>{msg='Error de conexión';render()}));
  unsubs.push(db.collection('rooms/'+c+'/players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()}));onChange()}));
}
function leaveSubs(){unsubs.forEach(u=>u());unsubs=[]}
function onChange(){
  if(view!=='room'||!room){if(view==='room'){render()}return}
  if(room.status==='playing'&&room.host===uid&&players.length&&players.every(p=>p.done))rRef(code).update({status:'finished'}).catch(()=>{});
  if(room.status==='finished'&&rec!==code+room.round){rec=code+room.round;record()}
  render();
}
function record(){run(async()=>{
  const m=P(uid);if(!m.done)return;
  const top=Math.max(...players.map(p=>p.score||0)),won=m.done==='win'&&m.score===top;
  me.played++;if(won){me.won++;me.streak++;me.best=Math.max(me.best,me.streak)}else me.streak=0;
  if(m.done==='win'){me.wins++;me.qsTotal+=m.qs;me.fast=Math.min(me.fast,m.qs)}
  me.hist=[{c:room.chars[uid]||'?',r:m.done,q:m.qs},...me.hist].slice(0,10);await pRef().set(me)})}
function leaveRoom(){
  const c=code,wasLobby=room&&room.status==='lobby'&&room.host!==uid;leaveSubs();
  if(wasLobby)plRef(c,uid).delete().catch(()=>{});code=null;room=null;go('menu')}
function vRoom(){
  if(!room)return `<p class="sub">Conectando a la sala…</p><button class="sec" onclick="leaveRoom()">Salir</button>`;
  const isHost=room.host===uid;
  if(room.status==='lobby')return `<h1>Sala</h1><div class="code">${esc(code)}</div><p class="sub">Pasales este código a tus besties</p>
<div class="card">${players.map(p=>`<div class="pl"><span class="e">${esc(p.emoji)}</span><span class="n">${esc(p.name)}</span>${p.id===room.host?'<span class="tag">host</span>':''}</div>`).join('')}
<p class="mut">${players.length}/6 jugadores · ${room.custom.length?room.custom.length+' personajes propios · ':''}${room.cats.length} categorías</p></div>
${isHost?`<button ${players.length<2?'disabled':''} onclick="startGame()">${players.length<2?'Esperando jugadores (mín. 2)':'¡Empezar!'}</button>`:'<p class="sub">Esperando que el host empiece…</p>'}
<button class="sec" onclick="leaveRoom()">Salir</button>`;
  if(room.status==='finished'){
    const rk=[...players].sort((a,b)=>(b.score||0)-(a.score||0)||(a.doneAt||9e15)-(b.doneAt||9e15));
    return `<h1>🏁 Final</h1><div class="card">${rk.map((p,i)=>`<div class="pl"><span class="e">${['🥇','🥈','🥉'][i]||'🎖️'}</span><span class="n"><b>${esc(p.name)}</b><div class="mut">${esc(room.chars[p.id])} · ${p.done==='win'?'adivinó en '+p.qs:'no adivinó'}</div></span><b>${p.score||0} pts</b></div>`).join('')}</div>
${isHost?'<button onclick="rematch()">🔁 Revancha</button>':'<p class="sub">El host puede iniciar la revancha</p>'}<button class="sec" onclick="leaveRoom()">Salir</button>`}
  const m=P(uid),mine=room.turn===uid&&!m.done,tp=P(room.turn);
  return `<div class="mut" style="text-align:center">Sala ${esc(code)}</div>
<div class="turn">${m.done?(m.done==='win'?'🎉 ¡Adivinaste! Sos espectador':'Te rendiste. Sos espectador'):mine?'👉 ¡Es tu turno! Hacé tu pregunta en voz alta':'Turno de '+esc(tp.emoji||'')+' '+esc(tp.name||'…')}</div>
<div class="card" style="text-align:center"><div class="mut">Tu personaje</div>${m.done?`<div class="ch">${esc(room.chars[uid])}</div>`:'<div class="q">❓</div>'}<div class="mut">Preguntas usadas: ${m.qs||0}</div></div>
<h2>Los demás</h2>${players.filter(p=>p.id!==uid).map(p=>`<div class="card pl"><span class="e">${esc(p.emoji)}</span><span class="n">${esc(p.name)}<div class="ch">${esc(room.chars[p.id])}</div></span>${p.done?`<span class="tag">${p.done==='win'?'✔ adivinó':'se rindió'}</span>`:''}</div>`).join('')}
${mine?(guessing?`<div class="card"><input id="gin" placeholder="Creo que soy…" oninput="gtext=this.value" onkeydown="if(event.key==='Enter')guess()"><button onclick="guess()">Confirmar</button><button class="sec" onclick="guessing=false;render()">Cancelar</button></div>`
:`<button onclick="passTurn()">✅ Ya me respondieron (pasar turno)</button><button class="sec" onclick="guessing=true;gtext='';render()">🤔 Creo que soy…</button>`):''}
${!m.done?'<button class="back" onclick="giveUp()">Me rindo</button>':''}${isHost&&!mine&&!m.done?'':''}${isHost&&room.turn&&!P(room.turn).done?'<button class="back" onclick="skipTurn()">Saltear turno de '+esc(tp.name||'')+' (host)</button>':''}
<button class="back" onclick="leaveRoom()">Salir de la sala</button>`;
}
function startGame(){run(async()=>{
  const pool=[...cats2(room.cats).flatMap(c=>CATS[c]),...room.custom];
  if(pool.length<players.length)throw new Error('Faltan personajes: sumá categorías o agregá propios');
  const pick=shuffle(pool),order=shuffle(players.map(p=>p.id)),chars={};
  order.forEach((u,i)=>chars[u]=pick[i]);
  await Promise.all(players.map(p=>plRef(code,p.id).update({qs:0,done:'',score:0,doneAt:0})));
  await rRef(code).update({status:'playing',order,chars,turn:order[0],round:(room.round||0)+1})})}
const cats2=a=>a.filter(c=>CATS[c]);
function rematch(){run(async()=>{await rRef(code).update({status:'lobby',chars:{},order:[],turn:''})})}
function nextAfter(from,doneIds){
  const o=room.order,i=o.indexOf(from);
  for(let k=1;k<=o.length;k++){const u=o[(i+k)%o.length];if(!doneIds.includes(u)&&!P(u).done)return u}
  return ''}
function passTurn(){run(async()=>{const n=nextAfter(uid,[]);
  await plRef(code,uid).update({qs:(P(uid).qs||0)+1});await rRef(code).update({turn:n})})}
function guess(){run(async()=>{
  const g=norm(gtext);if(!g)return;const c=norm(room.chars[uid]),qs=(P(uid).qs||0)+1;
  const ok=g===c||(Math.min(g.length,c.length)>=4&&(c.includes(g)||g.includes(c)));
  guessing=false;gtext='';
  if(ok){await plRef(code,uid).update({qs,done:'win',score:Math.max(1,11-qs),doneAt:Date.now()});await rRef(code).update({turn:nextAfter(uid,[uid])});}
  else{await plRef(code,uid).update({qs});await rRef(code).update({turn:nextAfter(uid,[])});msg='Nop, ese no es 😅';render()}})}
function giveUp(){if(!confirm('¿Seguro que te rendís?'))return;run(async()=>{
  const wasTurn=room.turn===uid;await plRef(code,uid).update({done:'gaveup',score:0,doneAt:Date.now()});
  if(wasTurn)await rRef(code).update({turn:nextAfter(uid,[uid])})})}
function skipTurn(){run(async()=>{await rRef(code).update({turn:nextAfter(room.turn,[])})})}
init();
</script>
</body>
</html>
